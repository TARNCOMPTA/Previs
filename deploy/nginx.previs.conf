# ─── Previs — configuration nginx ─────────────────────────────────────────────
# À adapter : remplacer previs.tarncompta.fr par le nom de domaine retenu.
# Déposer dans /etc/nginx/sites-available/previs puis activer par un lien
# symbolique dans /etc/nginx/sites-enabled/.

server {
    listen 80;
    listen [::]:80;
    server_name previs.tarncompta.fr;

    # Certbot dépose ici le jeton de validation du certificat.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name previs.tarncompta.fr;

    # Certificats déposés par Certbot — voir deploy/README-deploiement.md.
    ssl_certificate     /etc/letsencrypt/live/previs.tarncompta.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/previs.tarncompta.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # En-têtes de sécurité. Le logiciel héberge des données de clients du
    # cabinet : ces directives ne sont pas facultatives.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Un dossier volumineux, saisie mensuelle détaillée comprise, dépasse la
    # limite par défaut de 1 Mo.
    client_max_body_size 20m;

    # Le serveur applicatif compresse déjà ses réponses ; ces directives couvrent
    # ce qu'il laisserait passer en clair et les réponses servies par nginx.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    access_log /var/log/nginx/previs.access.log;
    error_log  /var/log/nginx/previs.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # La génération du dossier PDF met Chromium à contribution : la première
    # exécution après un redémarrage peut demander une dizaine de secondes.
    location ~ ^/api/dossiers/[^/]+/pdf$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Point d'entrée du serveur MCP : réponses en flux, mise en tampon désactivée.
    location = /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Les fichiers construits de l'interface portent une empreinte dans leur nom.
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
